name: Allocator Weekly Scoring

# Runs scripts/allocator.py weekly and commits the updated data.json.
# Safe on all-zero data (bootstrapping phase) — see scripts/allocator.py
# docstring and agents/allocator.md guardrails: never zeros a quota, never
# archives a branch, only flags Maintenance transitions to the CEO via
# decision_queue.

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday 06:00 UTC
  workflow_dispatch: {}

jobs:
  validate-and-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate data.json is well-formed
        run: python3 -c "import json; json.load(open('data.json')); print('data.json OK')"

      - name: Compute scores and update quotas
        run: python3 scripts/allocator.py

      - name: Commit updated data.json
        run: |
          git config user.name "vantage-bot"
          git config user.email "bot@vantage.local"
          git add data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Weekly allocator run"
          git push
